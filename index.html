<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRE Cayetano - Agenda de Recordatorios de Consejería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cepu-maroon: #5c1a4a;
            --cepu-navy: #2b2f6b;
            --cepu-gold: #f4b400;
        }
        body {
            background-color: #f3f1f6;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        /* ... (Tus otros estilos) ... */
    </style>
</head>
<body>

    <div class="main-container container mt-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center" style="color: var(--cepu-maroon);">Enviar Recordatorio</h3>
                
                <!-- Botón de prueba -->
                <div class="text-center mt-4">
                    <button class="btn btn-success btn-lg" onclick="enviarMensajeWhatsApp()">
                        Enviar WhatsApp al Alumno
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function enviarMensajeWhatsApp() {
            // 1. Simulación de los datos del alumno/cita (esto vendría de tu base de datos o formulario)
            const telefono = "51999999999"; // Reemplazar por el número del alumno
            const nombreAlumno = "Lucia";
            const fecha = "17 de setiembre de 2026";
            const hora = "16:00 pm";
            const psicologo = "Jamir Salazar";
            const lugar = "Cuarto piso (Cubículo 1)";

            // 2. Construir el mensaje usando Template Literals (las comillas invertidas ` `)
            // Aquí pones los emojis libremente.
            const mensaje = `¡Hola, ${nombreAlumno}, te saluda ${psicologo}!

Te recordamos tu cita de Consejería programada para hoy:

📅 Fecha: ${fecha}
⏰ Hora: ${hora}
👨‍💼 Psicólogo: ${psicologo}
🏢 Lugar: ${lugar}

✅ Por favor, te agradeceremos confirmar tu asistencia respondiendo a este mensaje.

¡Te esperamos! 😊

Área de Tutoría y Consejería 🎓👥`;

            // 3. LA SOLUCIÓN: Codificar el mensaje para que los emojis no se rompan
            const mensajeCodificado = encodeURIComponent(mensaje);

            // 4. Crear el enlace de WhatsApp con el mensaje codificado
            const urlWhatsApp = `https://wa.me/${telefono}?text=${mensajeCodificado}`;

            // 5. Abrir WhatsApp (en una nueva pestaña)
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
